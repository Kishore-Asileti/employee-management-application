# =============================
# Server
# =============================
server.port=8081

# =============================
# Couchbase Configuration
# =============================
spring.couchbase.connection-string=couchbase://localhost
spring.couchbase.username=Administrator
spring.couchbase.password=password
spring.data.couchbase.bucket-name=employee_management
spring.data.couchbase.auto-index=true

# =============================
# Camunda Configuration
# =============================
camunda.bpm.admin-user.id=admin
camunda.bpm.admin-user.password=admin
camunda.bpm.admin-user.firstName=Admin
camunda.bpm.webapp.application-path=/camunda
camunda.bpm.auto-deployment-enabled=true
camunda.bpm.deployment-resource-pattern=classpath*:processes/*.bpmn,classpath*:processes/*.bpmn20.xml

# H2 datasource for Camunda engine (process state, tasks, history)
spring.datasource.url=jdbc:h2:mem:camunda;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# =============================
# JWT
# =============================
app.jwt.secret=EmployeeMgmtSecretKey2024_SuperSecureBase64EncodedKey==
app.jwt.expiration-ms=86400000

# =============================
# Mail (configure SMTP for production)
# =============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# =============================
# Logging
# =============================
logging.level.org.camunda=INFO
logging.level.com.company=DEBUG
logging.level.org.springframework.security=DEBUG

# =============================
# CORS (Angular dev server)
# =============================
app.cors.allowed-origins=http://localhost:4200
